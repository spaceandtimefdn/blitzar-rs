name: Test-Check-Lint

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-code:
    name: Check Code
    runs-on: nvidia-nc4as-t4
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      PATH: ${{ github.workspace }}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout Code Format
        uses: actions/checkout@v3

      - name: Install Rust
        run: curl https://sh.rustup.rs -sSf | bash -s -- -y --profile minimal
          
      - name: Install stable toolchain and dependencies
        run: |
          rustup toolchain install
          rustup component add rustfmt

      - name: Run Code Format
        run: cargo fmt --all -- --config imports_granularity=Crate,group_imports=One --check

  clippy-code:
    name: Clippy Code
    runs-on: nvidia-nc4as-t4
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      PATH: ${{ github.workspace }}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Rust
        run: curl https://sh.rustup.rs -sSf | bash -s -- -y --profile minimal

      - name: Install stable toolchain and dependencies
        run: |
          rustup toolchain install
          rustup component add clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-cpu:
    name: Test the CPU backend
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      PATH: ${{ github.workspace }}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Run CPU test
        run: nix develop --command cargo test --no-default-features --features cpu

  test-gpu:
    name: Test the GPU backend
    runs-on: nvidia-nc4as-t4
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      PATH: ${{ github.workspace }}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Run GPU test
        run: nix develop --extra-experimental-features "nix-command flakes" ".#gpu" --command cargo test --features gpu
